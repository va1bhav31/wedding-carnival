<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2c2723" />
  <title>Couple Trivia · Aanya &amp; Vihaan</title>
  <link rel="preload" href="../shared/fonts/albert-sans.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="games.css" />
</head>
<body class="game">
  <header class="g-top">
    <a class="g-back" href="../game-hub/index.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>Games</a>
    <p class="g-name">Couple Trivia</p>
    <p class="g-pts"><b class="num">1,050</b> pts</p>
  </header>

  <main class="g-stage">
    <section class="view" data-view="not-open" data-label="Not open yet">
      <div class="quiet">
        <div class="ring" aria-hidden="true"></div>
        <h1>Not open yet</h1>
        <p>The host opens Couple Trivia during the Haldi. This page switches over by itself the moment it starts.</p>
        <div class="g-actions">
          <a class="btn btn-quiet btn-block" href="../game-hub/index.html">Back to games</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="g-foot">
    <details class="proto">
      <summary><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>Prototype states</summary>
      <p class="proto-note">Shown for any game the host hasn't started. In the app it checks every few seconds and opens the game on its own.</p>
      <div class="proto-actions"></div>
    </details>
  </footer>

  <script src="games.js"></script>
</body>
</html>
